  <g id="figure-caption" font-size="14px" fill="#374151">
    <text class="caption" x="24" y="1600" font-size="14px" fill="#374151" text-anchor="start">外框：管理范围；如 node.Node 管理已注册服务；Ethereum 内部以最近一层容器表示创建和管理归属。</text>
    <text class="caption" x="24" y="1622" font-size="14px" fill="#374151" text-anchor="start">实线：调用关系；虚线：同步数据来源，请求由同步模块发起。</text>
    <text class="caption" x="24" y="1644" font-size="14px" fill="#374151" text-anchor="start">“复用”：沿用已有实现；“新增”：需要新实现的模块或接口；“修改”：调整现有实现。</text>
  </g>
</svg>
